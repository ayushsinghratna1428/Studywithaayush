<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study With Aayyush</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#8fd3f4,#fcb69f);
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
text-align:center;
}

.logo{
width:120px;
height:120px;
border-radius:50%;
margin-top:20px;
}

h1{
color:white;
font-size:50px;
font-weight:bold;
margin-top:20px;
text-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.tagline{
color:white;
font-size:18px;
margin-top:10px;
margin-bottom:25px;
}

.search-box{
width:90%;
max-width:700px;
padding:18px;
border:none;
border-radius:50px;
outline:none;
font-size:18px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(15px);
color:white;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.search-box::placeholder{
color:white;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:40px;
}

.card{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
border-radius:25px;
padding:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
transition:0.3s;
cursor:pointer;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:12px;
background:white;
}

.card h3{
color:white;
font-size:28px;
margin-top:15px;
}

.card p{
color:white;
font-size:16px;
margin-top:8px;
}

@media(max-width:600px){

h1{
font-size:38px;
}

.card img{
height:120px;
}

}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>STUDY WITH AAYYUSH</h1>

<p class="tagline">
Premium access to PW, Next Toppers, Vibrant, Mission Jeet and more resources.
</p>

<input
type="text"
class="search-box"
placeholder="Search for classes, batches..."
>

<div class="cards">

<div class="card">
<img src="pw.png">
<h3>PW</h3>
<p>Let's Study</p>
</div>

<div class="card">
<img src="nexttoppers.png">
<h3>Next Toppers</h3>
<p>Let's Study</p>
</div>

<div class="card">
<img src="vibrant.png">
<h3>Vibrant</h3>
<p>Let's Study</p>
</div>

<div class="card">
<img src="missionjeet.png">
<h3>Mission Jeet</h3>
<p>Let's Study</p>
</div>

</div>

</div>

</body>
  </html>
